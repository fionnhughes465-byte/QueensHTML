<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Submit Issue</title>

        <link rel="stylesheet" href="CSS/styles.css">
    </head>

    <body>
        <div class="page">
            <div class="banner">
                <a href="account.html"><img src="Images/logo.png"></a>
            </div>

            <div class="main">
                <h1>Please tell us your issue:</h1>
                <form id="submitIssueForm">
                    <label for="city">City:</label>
                    <select name="city" id="city" required>
                        <option value="102">London</option>
                        <option value="103">Birmingham</option>
                        <option value="104">Glasgow</option>
                        <option value="105">Liverpool</option>
                        <option value="106">Bristol</option>
                        <option value="107">Sheffield</option>
                        <option value="108">Manchester</option>
                        <option value="109">Leeds</option>
                        <option value="110">Edinburgh</option>
                        <option value="111">Leicester</option>
                        <option value="112">Bradford</option>
                        <option value="113">Cardiff</option>
                        <option value="114">Coventry</option>
                        <option value="115">Nottingham</option>
                        <option value="116">Hull</option>
                        <option value="117">Belfast</option>
                        <option value="118">Stoke</option>
                        <option value="119">Newcastle</option>
                        <option value="120">Wolverhampton</option>
                        <option value="121">Derby</option>
                        <option value="122">Southampton</option>
                        <option value="123">Portsmouth</option>
                        <option value="124">Plymouth</option>
                        <option value="125">Brighton and Hove</option>
                        <option value="126">Westminster</option>
                    </select>
                    <br>
                    <br>
                    <label for="description">Issue:</label>
                    <input type="text" name="description" id="description" required>
                    <br>
                    <br>
                    <button class="submitButton" type="submit">Submit</button>
                </form>
                <div id="messageOutput"></div>
            </div>
        </div>

        <script src="JavaScript/myJs.js"></script>
        <script>
            // create references (const)
            const form = document.getElementById("submitIssueForm");
            const city = document.getElementById("city");
            const description = document.getElementById("description");
            const outputDiv = document.getElementById("messageOutput");

            // add event listener
            form.addEventListener("submit", async function(event) {
                // Prevent the default form submission behaviour (page refresh)
                event.preventDefault();

                //Gets the user's detailed that were stored from the createAccount or login page
                const userID = localStorage.getItem("userID");
                //Gets todays date, which is used later to fill in the record
                const today = new Date().toISOString().split("T")[0];

                //sql statement getting the information for the submitted issue
                const sql = `
                    INSERT INTO Submitted_Issue (UserID, CityID, ReviewID, Issue, Date, IsRejected)
                    VALUES ('${userID}', ${city.value}, NULL, '${description.value}', '${today}', 0)
                `;

                try {
                    //Running the above sql
                    const result = await runQuery(sql);

                    //Runs if the issue was successfully submitted
                    if (result.success) {
                        outputDiv.textContent = "Issue Submitted, Thank You";
                        form.reset();
                    } else {
                        outputDiv.textContent = result.error;
                    }
                } catch (error) {
                    outputDiv.textContent = "Request failed";
                    console.error(error);
                }
            });
        </script>
    </body>
</html>
