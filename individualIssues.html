<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1">
        <title>Individual Issues</title>

        <link rel="stylesheet" href="CSS/styles.css">

    </head>

    <body>
        <div class="page">
            <div class="banner">
                <a href="account.html"><img src="Images/logo.png"></a>
            </div>

            <div class="main">
                <h1>Your Issues</h1>
                <br>
                <div id="issuesContainer"></div>
            </div>
        </div>

        <script src="JavaScript/myJs.js"></script>
        <script>
            //Stores the CityIDs alongside their related city, so I can display the city name next to the issue details
            const cities = {};

            async function loadCities() {
                const response = await runQuery("SELECT CityID, Name FROM City");

                if (!response.data || !Array.isArray(response.data)) return;

                response.data.forEach(function(city) {
                    cities[city.CityID] = city.Name;
                });
            }

            window.addEventListener("DOMContentLoaded", async () => {
            await loadCities();
                //Gets the users details that were stored
                const userID = localStorage.getItem("userID");
                const container = document.getElementById("issuesContainer");

                //sql statement to get all issues the user submitted
                const sql = "SELECT * FROM Submitted_Issue WHERE UserID=" + userID;

                try {
                    //Running the sql from above
                    const result = await runQuery(sql);

                    //Should display this message if there were no issues found
                    if (!result || !result.data || !Array.isArray(result.data)) {
                        container.innerHTML = "<p>No issues found</p>";
                        return;
                    }

                    const issues = result.data;

                    if (issues.length === 0) {
                        container.innerHTML = "<p>No issues found</p>";
                        return;
                    }

                    let html = "";

                    //Goes through every issue that the user submitted
                    issues.forEach(issue => {

                        //Takes the value of 1 or 0 from the submitted issues table, and turns it into a status message
                        const status = issue.IsRejected == 1 ? "Rejected" : "Not Rejected";

                        //Creates the display for each issue
                        html += `
                            <div class="dropdown">
                                Issue ID (${issue.IssueID})
                                <div class="dropdown-content">
                                    <strong>City:</strong> ${cities[issue.CityID] || "Unknown"} <br>
                                    <strong>Status:</strong> ${status} <br>
                                    <strong>Issue:</strong> ${issue.Issue}
                                </div>
                            </div>
                        `;
                    });

                    //This is so the above html gets displayed
                    container.innerHTML = html;

                } catch (error) {
                    console.error(error);
                    container.innerHTML = "<p>Error loading issues</p>";
                }
            });
        </script>
    </body>
</html>
