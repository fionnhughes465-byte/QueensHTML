<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1">
        <title>Log In</title>

        <link rel="stylesheet" href="styles.css">

    </head>

    <body>
        <div class="page">
            <div class="banner">
                <img src="images/logo.png">
            </div>

            <div class="main">
                <h1>Log In</h1>
                <form id="loginForm">
                <label for="email">Enter Email:</label>
                <input type="text" name="email" id="email" required>
                <br>
                <br>
                <label for="password">Enter Password:</label>
                <input type="text" name="password" id="password" required>
                <br>
                <a href="createAccount.html"><button class="createAccountButton" type="button">Create Account</button></a>
                <button class="submitButton" type="submit">Submit</button>
                </form>
                <div id="messageOutput"></div>
            </div>
        </div>

        <script>
        // create references (const)
        const form = document.getElementById("loginForm");
        const inputEmail = document.getElementById("email");
        const inputPassword = document.getElementById("password");
        const outputDiv = document.getElementById("messageOutput");

        //add event listener
        form.addEventListener("submit", function(event) {
            // Prevent the default form submission behaviour (page refresh)
            event.preventDefault();

            // // Replace the div text with a message telling users the login deatils are incorrect
            // outputDiv.textContent = "Incorrect login details";

            //takes users to account page if details are correct
            outputDiv.textContent = "...logging in...";
            window.location.href = "account.html";
            
        });
        </script>
    </body>
</html>
