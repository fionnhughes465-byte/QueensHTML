<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Tour Operator · Sample Data Table</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #e9f0f5 0%, #d9e2ec 100%);
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* main card container */
        .table-container {
            max-width: 1300px;
            width: 100%;
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.05);
            padding: 1.5rem 1.2rem 2rem 1.2rem;
            transition: all 0.2s ease;
        }

        /* header & title */
        .title-section {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            margin-bottom: 1.8rem;
            padding: 0 0.25rem;
        }

        h1 {
            font-size: 1.9rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #1A2A3F, #2C4C6E);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            display: inline-block;
        }

        .badge {
            background: #2c4c6e20;
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 60px;
            font-size: 0.85rem;
            font-weight: 500;
            color: #1e3a5f;
            border: 1px solid #ffffff70;
        }

        /* table wrapper: responsive overflow */
        .table-wrapper {
            overflow-x: auto;
            border-radius: 1.2rem;
            background: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }

        /* modern table design */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.95rem;
            min-width: 550px;
        }

        .data-table thead tr {
            background: #1f3b4c;
            background: linear-gradient(110deg, #1f3b4c 0%, #1e3a4d 100%);
        }

        .data-table th {
            color: white;
            font-weight: 600;
            padding: 1rem 1.2rem;
            text-align: left;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
            border-bottom: 2px solid #2f607c;
        }

        .data-table td {
            padding: 0.9rem 1.2rem;
            border-bottom: 1px solid #e2edf2;
            vertical-align: middle;
            color: #1c2e3f;
            font-weight: 450;
        }

        /* row hover effect */
        .data-table tbody tr {
            transition: background 0.2s ease;
        }

        .data-table tbody tr:hover {
            background: #f0f8fe;
            cursor: default;
        }

        /* availability badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: #eef2f5;
            padding: 0.25rem 0.85rem;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            width: fit-content;
        }

        .status-badge.available {
            background: #dcfce7;
            color: #15803d;
            border-left: 3px solid #22c55e;
        }

        .status-badge.unavailable {
            background: #ffe8e6;
            color: #b91c1c;
            border-left: 3px solid #ef4444;
        }

        .status-badge.limited {
            background: #fff3e0;
            color: #b45309;
            border-left: 3px solid #f97316;
        }

        /* duration chip */
        .duration-chip {
            background: #e9edf2;
            border-radius: 24px;
            padding: 0.2rem 0.7rem;
            font-size: 0.8rem;
            font-weight: 500;
            display: inline-block;
            color: #2c3e50;
        }

        /* city styling */
        .city-name {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .city-icon {
            font-size: 1rem;
        }

        /* responsive touches */
        @media (max-width: 680px) {
            body {
                padding: 1rem;
            }
            .table-container {
                padding: 1rem;
            }
            .data-table th, .data-table td {
                padding: 0.7rem 0.9rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }

        /* footer note */
        .footer-note {
            margin-top: 1.5rem;
            text-align: right;
            font-size: 0.75rem;
            color: #3a5b70;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .refresh-info {
            background: #ffffffb3;
            padding: 0.2rem 0.9rem;
            border-radius: 40px;
            font-family: monospace;
            font-size: 0.7rem;
        }
    </style>
</head>
<body>
<div class="table-container">
    <div class="title-section">
        <div>
            <h1>🗺️ Tour Destinations</h1>
            <p style="font-size: 0.85rem; color: #2c5a74; margin-top: 6px;">active routes & availability overview</p>
        </div>
        <div class="badge">✨ 20 curated entries</div>
    </div>

    <div class="table-wrapper">
        <table class="data-table" id="tourTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>City/Town</th>
                    <th>Duration</th>
                    <th>Available</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- 20 rows will be dynamically populated with JS, but also static fallback if needed -->
            </tbody>
        </table>
    </div>
    <div class="footer-note">
        <span>📅 all data reflects real sample tours · statuses may include 'Available', 'Limited', 'Unavailable'</span>
        <span class="refresh-info">🔄 generated: <span id="timestamp"></span></span>
    </div>
</div>

<script>
    (function() {
        // --------------------------------------------------------------
        // rich dataset with 20 unique tour entries (city, name, duration, availability)
        // providing variety and realistic travel themes
        // --------------------------------------------------------------
        const toursData = [
            { id: 101, name: "Alpine Discovery", cityTown: "Interlaken", duration: "5 days", available: "Available" },
            { id: 102, name: "Coastal Heritage", cityTown: "Lisbon", duration: "4 days", available: "Available" },
            { id: 103, name: "Northern Lights Expedition", cityTown: "Tromsø", duration: "3 days", available: "Limited" },
            { id: 104, name: "Santorini Sunset", cityTown: "Fira", duration: "2 days", available: "Unavailable" },
            { id: 105, name: "Kyoto Temples & Gardens", cityTown: "Kyoto", duration: "6 days", available: "Available" },
            { id: 106, name: "Moroccan Souks", cityTown: "Marrakech", duration: "4 days", available: "Limited" },
            { id: 107, name: "Scottish Highlands", cityTown: "Inverness", duration: "5 days", available: "Available" },
            { id: 108, name: "Icelandic Adventure", cityTown: "Reykjavík", duration: "7 days", available: "Unavailable" },
            { id: 109, name: "Amalfi Coast Drive", cityTown: "Positano", duration: "3 days", available: "Limited" },
            { id: 110, name: "Banff Wilderness", cityTown: "Banff", duration: "4 days", available: "Available" },
            { id: 111, name: "Machu Picchu Explorer", cityTown: "Cusco", duration: "8 days", available: "Limited" },
            { id: 112, name: "Swiss Chocolate Tour", cityTown: "Zurich", duration: "2 days", available: "Available" },
            { id: 113, name: "Greek Island Hopping", cityTown: "Mykonos", duration: "6 days", available: "Available" },
            { id: 114, name: "Croatian Riviera", cityTown: "Dubrovnik", duration: "5 days", available: "Unavailable" },
            { id: 115, name: "Safari Serengeti", cityTown: "Arusha", duration: "7 days", available: "Limited" },
            { id: 116, name: "Patagonian Trek", cityTown: "El Calafate", duration: "6 days", available: "Available" },
            { id: 117, name: "Norwegian Fjords", cityTown: "Bergen", duration: "4 days", available: "Available" },
            { id: 118, name: "Bali Spiritual Retreat", cityTown: "Ubud", duration: "5 days", available: "Limited" },
            { id: 119, name: "Tuscany Vineyards", cityTown: "Florence", duration: "3 days", available: "Available" },
            { id: 120, name: "Prague Castle Walk", cityTown: "Prague", duration: "2 days", available: "Unavailable" }
        ];

        // mapping for status styling and icons (we will add a little extra flair)
        function getAvailabilityHtml(status) {
            const lowerStatus = status.toLowerCase();
            if (lowerStatus === 'available') {
                return `<span class="status-badge available">✅ Available</span>`;
            } else if (lowerStatus === 'limited') {
                return `<span class="status-badge limited">⚠️ Limited spots</span>`;
            } else if (lowerStatus === 'unavailable') {
                return `<span class="status-badge unavailable">❌ Unavailable</span>`;
            } else {
                return `<span class="status-badge">${status}</span>`;
            }
        }

        // add small city icon mapping for fun
        function getCityWithIcon(cityName) {
            let icon = "📍";
            const lowerCity = cityName.toLowerCase();
            if (lowerCity.includes("interlaken") || lowerCity.includes("zurich") || lowerCity.includes("bergen")) icon = "🏔️";
            else if (lowerCity.includes("lisbon") || lowerCity.includes("positano") || lowerCity.includes("mykonos")) icon = "🌊";
            else if (lowerCity.includes("kyoto") || lowerCity.includes("ubud")) icon = "🌸";
            else if (lowerCity.includes("marrakech") || lowerCity.includes("cusco")) icon = "🏜️";
            else if (lowerCity.includes("tromsø") || lowerCity.includes("reykjavík")) icon = "❄️";
            else if (lowerCity.includes("inverness") || lowerCity.includes("dubrovnik")) icon = "🏰";
            else if (lowerCity.includes("banff") || lowerCity.includes("el calafate")) icon = "🏞️";
            else if (lowerCity.includes("prague") || lowerCity.includes("florence")) icon = "🎨";
            else icon = "🏙️";
            return `<span class="city-name"><span class="city-icon">${icon}</span> ${cityName}</span>`;
        }

        // format duration with small badge style
        function getDurationHtml(duration) {
            return `<span class="duration-chip">⏱️ ${duration}</span>`;
        }

        // get table body element
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;

        // clear any placeholder content
        tbody.innerHTML = '';

        // loop through toursData (exactly 20 rows) and generate rows
        toursData.forEach(tour => {
            const row = document.createElement('tr');
            
            // ID cell
            const idCell = document.createElement('td');
            idCell.textContent = tour.id;
            idCell.style.fontWeight = '600';
            idCell.style.fontFamily = "'JetBrains Mono', monospace";
            idCell.style.fontSize = '0.85rem';
            row.appendChild(idCell);
            
            // Name cell (tour name)
            const nameCell = document.createElement('td');
            nameCell.textContent = tour.name;
            nameCell.style.fontWeight = '500';
            row.appendChild(nameCell);
            
            // City/Town cell with icon helper
            const cityCell = document.createElement('td');
            cityCell.innerHTML = getCityWithIcon(tour.cityTown);
            row.appendChild(cityCell);
            
            // Duration cell
            const durationCell = document.createElement('td');
            durationCell.innerHTML = getDurationHtml(tour.duration);
            row.appendChild(durationCell);
            
            // Available cell with dynamic badge
            const availCell = document.createElement('td');
            availCell.innerHTML = getAvailabilityHtml(tour.available);
            row.appendChild(availCell);
            
            tbody.appendChild(row);
        });

        // set timestamp for fun
        const timestampSpan = document.getElementById('timestamp');
        if (timestampSpan) {
            const now = new Date();
            const formatted = `${now.toLocaleDateString()} ${now.toLocaleTimeString([], { hour: '2-digit', minute:'2-digit' })}`;
            timestampSpan.textContent = formatted;
        }

        // optional: add small data consistency check: if any row missing but we already have 20 entries exactly
        console.log(`✅ Table populated with ${toursData.length} rows. IDs: ${toursData.map(t => t.id).join(', ')}`);
        
        // little extra: you can add a data attribute to each row for animation
        const rows = document.querySelectorAll('#tourTable tbody tr');
        rows.forEach((row, idx) => {
            row.style.transition = 'all 0.1s ease';
            // optional staggered micro effect
            row.style.opacity = '0';
            setTimeout(() => {
                row.style.opacity = '1';
            }, idx * 15);
        });
    })();
</script>
</body>
</html
