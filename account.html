<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1">
        <title>Account</title>

        <link rel="stylesheet" href="styles.css">

    </head>

    <body>
        <div class="page">
            <div class="banner">
                <a href="account.html"><img src="images/logo.png"></a>
            </div>

            <div class="main">
                <h1>Account</h1>
                    <h2>Acount Information:</h2>
                <div class="accountInfo">
                    <form id="accountInformation">
                        <label for="email" style="font-size: small; color: black;">Email:</label>
                        <input type="text" name="email" id="email" value="email123" required>
                        <br>
                        <label for="password" style="font-size: small; color: black;">Enter Password:</label>
                        <input type="text" name="password" id="password" value="password123" required>
                        <br>
                        <label for="postcode" style="font-size: small; color: black;">Enter Postcode:</label>
                        <input type="text" name="postcode" id="postcode" value="postcode123" required>
                        <br>
                        <label for="firstName" style="font-size: small; color: black;">Enter First Name:</label>
                        <input type="text" name="firstName" id="firstName" value="fname" required>
                        <br>
                        <label for="lastName" style="font-size: small; color: black;">Enter Last Name:</label>
                        <input type="text" name="lastName" id="lastName" value="lname" required>
                        <button class="submitButton" type="submit">Update Information</button>
                    </form>
                    <div id="messageOutput"></div>
                </div>
                <div class="accountOptions">
                    <a href="submitIssue.html"><button class="accountButton" type="button">Submit Issue</button></a>
                    <a href="individualIssues.html"><button class="accountButton" type="button">View Your Issues</button></a>
                    <a href="allIssues.html"><button class="accountButton" type="button">View All Reviewed Issues</button></a>
                </div>
            </div>
        </div>
        <script>
        // create references (const)
        const form = document.getElementById("accountInformation");
        const outputDiv = document.getElementById("messageOutput");

        //add event listener
        form.addEventListener("submit", function(event) {
            // Prevent the default form submission behaviour (page refresh)
            event.preventDefault();

            // Replace the div text with a confirmation of update
            outputDiv.textContent = "Information Updated";
            
            //it should leave the current and updated information in the boxes
        });
        </script>
    </body>
</html>
