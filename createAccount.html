<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport"
        content="width=device-width,
        initial-scale=1">
        <title>Create Account</title>

        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <div class="page">
            <div class="banner">
                <a href="login.html"><img src="logo.png"></a>
            </div>

            <div class="main">
                <h1>Create Account</h1>
                <form id="createAccountForm">
                <label for="email">Enter Email:</label>
                <input type="text" name="email" id="email" required>
                <br>
                <br>
                <label for="password">Enter Password:</label>
                <input type="text" name="password" id="password" required>
                <br>
                <br>
                <label for="postcode">Enter Postcode:</label>
                <input type="text" name="postcode" id="postcode" required>
                <br>
                <br>
                <label for="firstName">Enter First Name:</label>
                <input type="text" name="firstName" id="firstName" required>
                <br>
                <br>
                <label for="lastName">Enter Last Name:</label>
                <input type="text" name="lastName" id="lastName" required>
                <br>
                <br>
                <button class="submitButton" type="submit">Submit</button>
                </form>
                <div id="messageOutput"></div>
            </div>
        </div>

        <script src="JavaScript/myJs.js"></script>

        <script>
        const form = document.getElementById("createAccountForm");
        const inputEmail = document.getElementById("email");
        const inputPassword = document.getElementById("password");
        const inputPostcode = document.getElementById("postcode");
        const inputFirstName = document.getElementById("firstName");
        const inputLastName = document.getElementById("lastName");
        const outputDiv = document.getElementById("messageOutput");

        //add event listener
        form.addEventListener("submit", async function(event) {
            // Prevent the default form submission behaviour (page refresh)
            event.preventDefault();

            //TEMPORARY!!!!!!!!!! WILL CHANGE WHEN USERID GETS AUTO INCREMENTED!!! ONCE USERID AUTO INCREMENTS, REMOVE THE '20' FROM DOWN THERE!!! ALSO REMOVE THIS COMMENT
            //Takes the vlaues that were input into the boxes, and fills them into the SQL statement
            const sql = `
                INSERT INTO User (UserID, Email, Password, Postcode, Forename, Surname)
                VALUES (20, '${inputEmail.value}', '${inputPassword.value}', '${inputPostcode.value}', '${inputFirstName.value}', '${inputLastName.value}')
            `;
            try {
                //Uses runQuery from myJs.js, along with the SQL statement we just made
                const result = await runQuery(sql);

                //If there aren't any errors then this is execcuted
                if (result.success) {

                    //This is for a query to look up the user with the email that was just typed in (Assuming there in only one of each email. Can be changed to look at UserID after I'm not manually setting UserID anymore)
                    const getUser =
                        "SELECT * FROM `User` WHERE Email='" + inputEmail.value + "'";

                    //Runs the above query
                    const userResult = await runQuery(getUser);
                    const user = userResult.data[0];//Returns the first and only result, which should be the user who just put their details in

                    //Stores the UserID if the user who just logged in so it is used on account when it switches pages
                    localStorage.setItem("userID", user.UserID);

                    // Replace the div text with a confirmation of submission
                    outputDiv.textContent = "Account Created";

                    //Clear the input box
                    inputEmail.value = "";
                    inputPassword.value = "";
                    inputPostcode.value = "";
                    inputFirstName.value = "";
                    inputLastName.value = "";

                    //takes the user to their new account
                    window.location.href = "account.html";

                } else { //If something goes wrong, for example it tries to create a user with an already existing UserID, then this happens
                    outputDiv.textContent = "Database error";
                }

            } catch (error) {
                outputDiv.textContent = "Request failed";
                console.error(error);
            }
        });
        </script>
    </body>
</html>
